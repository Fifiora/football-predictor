name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look at bookmaker odds sources
        run: |
          python3 - <<'PY'
          import csv, collections, io, urllib.request
          for u in ["https://www.football-data.co.uk/fixtures.csv", "https://www.football-data.co.uk/mmz4281/2627/E0.csv", "https://www.football-data.co.uk/mmz4281/2526/E0.csv"]:
              try:
                  raw = urllib.request.urlopen(u, timeout=60).read()
              except Exception as e:
                  print(f"::notice title=fetch {u[-22:]}::FAILED {e}")
                  continue
              rows = list(csv.DictReader(io.StringIO(raw.decode("latin-1"))))
              cols = list(rows[0].keys()) if rows else []
              last = rows[-1] if rows else {}
              odds = [c for c in cols if c[:2] in ("B3","PS","Av","Ma","WH","BW","IW","VC","1X","BF","Bb","BM","BV","Co","P>","P<","A>","A<")]
              print("::notice title=" + u[-22:] + "::rows=%d divs=%s lastdate=%s odds=%s" % (len(rows), dict(collections.Counter(r.get("Div") for r in rows)), last.get("Date"), ",".join(odds[:70])))
          PY
