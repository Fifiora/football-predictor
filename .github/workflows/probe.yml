name: probe
# One-off, read-only: which competitions the feed offers on our key, and whether cross-league club ratings are reachable.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Competitions on our football-data.org key
        env: { T: "${{ secrets.FOOTBALL_DATA_TOKEN }}" }
        run: |
          curl -s -m 30 -H "X-Auth-Token: $T" https://api.football-data.org/v4/competitions > comps.json || true
          python3 - <<'PY'
          import json
          try: d=json.load(open("comps.json"))
          except Exception as e: print("::error title=comps::unreadable", e); raise SystemExit
          cs=d.get("competitions",[])
          print("::notice title=competitions::%d listed%%0A%s" % (len(cs), "%0A".join(f"{c['code']} {c['name']} ({c['area']['name']}) plan={c.get('plan')} type={c.get('type')}" for c in cs)))
          PY
          for c in CL EL UCL ECL FAC CDR CIT DFB FAC; do
            code=$(curl -s -m 30 -o m_$c.json -w "%{http_code}" -H "X-Auth-Token: $T" "https://api.football-data.org/v4/competitions/$c/matches?dateFrom=2026-10-27&dateTo=2026-11-10")
            n=$(python3 -c "import json;print(len(json.load(open('m_$c.json')).get('matches',[])))" 2>/dev/null || echo "?")
            echo "::notice title=matches $c::HTTP $code, $n matches in the next two weeks"
          done
      - name: Cross-league club ratings (ClubElo)
        run: |
          for u in "http://api.clubelo.com/2026-10-26" "https://api.clubelo.com/2026-10-26" "http://clubelo.com/2026-10-26"; do
            for try in 1 2 3; do
              code=$(curl -s -m 40 -L -o elo.csv -w "%{http_code}" "$u")
              [ "$code" = "200" ] && break
              sleep 5
            done
            rows=$(wc -l < elo.csv)
            echo "::notice title=clubelo $u::HTTP $code, $rows rows. $(head -2 elo.csv | cut -c1-160 | tr '\n' '|') $(grep -E 'Benfica|Ajax|Inter,|Arsenal' elo.csv | head -4 | tr '\n' '|')"
          done
      - name: Public cup results history (openfootball)
        run: |
          for u in champions-league europe-champions-league; do
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "https://api.github.com/repos/openfootball/$u")
            echo "::notice title=openfootball $u::HTTP $code"
          done
