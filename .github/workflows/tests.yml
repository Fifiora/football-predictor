name: tests
on:
  workflow_dispatch:
  push:
    paths: ["src/**", "tests/**", "data/**", "pyproject.toml", ".github/workflows/tests.yml"]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Run the Python tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --no-header -p no:cacheprovider -W ignore > pytest.log 2>&1
          code=$?
          tail -5 pytest.log
          if [ "$code" != "0" ]; then
            # run logs are not readable from outside, so put the failures in an annotation
            echo "::error title=pytest failed::$(grep -E '^(FAILED|ERROR)|Error|assert' pytest.log | head -c 3500 | tr '\n' '|')"
            exit "$code"
          fi
