name: tune
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python -m footpred.pipeline.cli download
      - run: python -m footpred.pipeline.cli tune-european --out docs/european-tuning.md
      - run: cat docs/european-tuning.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the results
        run: |
          git config user.name footpred-bot
          git config user.email bot@users.noreply.github.com
          git add docs/european-tuning.md
          git commit -m "European tuning results" || echo "no change"
          git pull -q --rebase origin main
          git push origin HEAD:main
