name: tune
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python -m footpred.pipeline.cli download
      - name: Tune the league model on development seasons
        run: python -m footpred.pipeline.cli tune-league --out docs/league-tuning.md
      - name: Show results in the run summary
        run: cat docs/league-tuning.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the results
        run: |
          git config user.name footpred-bot
          git config user.email bot@users.noreply.github.com
          git add docs/league-tuning.md
          git commit -m "Record league tuning results" || echo "no change"
          git pull -q --rebase origin main
          git push origin HEAD:main
