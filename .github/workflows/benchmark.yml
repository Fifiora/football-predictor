name: benchmark
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python -m footpred.pipeline.cli download
      - name: Run baseline-versus-hybrid benchmark
        run: python -m footpred.pipeline.cli benchmark --out docs/baseline-results.md
      - name: Run the Champions League benchmark
        run: python -m footpred.pipeline.cli benchmark-european --out docs/european-results.md
      - name: Show results in the run summary
        run: cat docs/baseline-results.md docs/european-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the results
        run: |
          git config user.name footpred-bot
          git config user.email bot@users.noreply.github.com
          git add docs/baseline-results.md docs/european-results.md docs/benchmark-reference.json
          git commit -m "Update baseline results from a real-data benchmark" || echo "no change"
          git push origin HEAD:main
